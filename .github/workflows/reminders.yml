name: トレ通知の送信

# 毎時実行は停止中。secrets.FIREBASE_SERVICE_ACCOUNT のJSONが壊れており
# ("Unexpected non-whitespace character after JSON at position 8")、毎時失敗して
# 失敗通知メールだけが届く状態だったため。シークレットを入れ直したら schedule を戻す。
# なおiOSアプリの通知は端末内のローカル通知なので、これが止まっていても影響しない。
on:
  workflow_dispatch:        # 手動テスト用

# 同時実行を防ぐ(重複送信の保険)
concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install firebase-admin
        run: npm install firebase-admin@13
      - name: send reminders
        run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
